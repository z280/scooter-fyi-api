<!doctype html>
<!--
  Drop-in /auth-callback page for denver.scooter.fyi (or any other origin
  that's on map_auth.allowed_return_origins in this repo's config.json).

  This page lives on the CLIENT (e.g. denver.scooter.fyi), NOT on
  data.scooter.fyi. The map-auth flow redirects the browser here with the
  bearer token in a URL fragment:

      https://denver.scooter.fyi/auth-callback#token=...&expires=...

  The page below:
    1. Reads location.hash.
    2. Validates shape.
    3. Stashes (token, expires) in sessionStorage.
    4. Scrubs the fragment from the URL via history.replaceState.
    5. Redirects to ?next=... (validated against same-origin) or "/".

  No external dependencies. Safe to deploy as a static HTML file at the
  Pages site root. Inline CSP is permitted by default for static hosts.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Signing in…</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
           display: flex; align-items: center; justify-content: center;
           min-height: 100vh; margin: 0; background: #f7f7f7; color: #222; }
    .card { padding: 24px 32px; background: white; border-radius: 8px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.08); max-width: 32em; }
    h1 { margin: 0 0 12px; font-size: 18px; }
    p { margin: 0; opacity: 0.75; font-size: 14px; }
    .err { color: #c00; }
  </style>
</head>
<body>
  <div class="card">
    <h1 id="status">Signing in…</h1>
    <p id="detail">Validating your session.</p>
  </div>

<script>
(function () {
  "use strict";

  // sessionStorage key the rest of the frontend reads to get the bearer.
  // Use sessionStorage (not localStorage) so the token doesn't survive a
  // tab close. The 8h expiry also bounds the worst case.
  var STORAGE_KEY = "scooter_fyi.map_auth";

  function fail(msg) {
    document.getElementById("status").textContent = "Sign-in failed";
    var d = document.getElementById("detail");
    d.className = "err";
    d.textContent = msg;
  }

  function parseFragment(hash) {
    if (!hash || hash[0] !== "#") return {};
    var out = {};
    hash.slice(1).split("&").forEach(function (pair) {
      var eq = pair.indexOf("=");
      if (eq < 0) return;
      var k = decodeURIComponent(pair.slice(0, eq));
      var v = decodeURIComponent(pair.slice(eq + 1));
      out[k] = v;
    });
    return out;
  }

  var frag = parseFragment(location.hash);
  var token = frag.token;
  var expires = frag.expires;

  if (!token || !/^[A-Za-z0-9_\-]{20,}$/.test(token)) {
    fail("Missing or malformed token in URL.");
    return;
  }
  if (!expires || isNaN(Date.parse(expires))) {
    fail("Missing or malformed expiry in URL.");
    return;
  }

  try {
    sessionStorage.setItem(STORAGE_KEY, JSON.stringify({
      token: token,
      expires: expires,
      issued_at: new Date().toISOString(),
    }));
  } catch (e) {
    fail("Could not persist token in this browser (sessionStorage blocked?).");
    return;
  }

  // Scrub the fragment from the URL bar so the token can't be copied out
  // of the address bar / shared in a screenshot.
  try {
    history.replaceState(null, "", location.pathname + location.search);
  } catch (e) { /* old browsers — best-effort */ }

  // Where to send the user next. Validate against same-origin to prevent
  // an open-redirect: ?next= must start with "/" and not "//".
  var params = new URLSearchParams(location.search);
  var next = params.get("next");
  if (!next || next[0] !== "/" || next.indexOf("//") === 0) {
    next = "/";
  }

  document.getElementById("status").textContent = "Signed in";
  document.getElementById("detail").textContent = "Redirecting…";
  setTimeout(function () { location.replace(next); }, 250);
})();
</script>
</body>
</html>
