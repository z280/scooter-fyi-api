# Compose project name, pinned rather than inherited from the directory.
#
# Without this, the project name is the deploy directory's basename
# (/opt/veo-audit -> "veo-audit"), and EVERY named volume is prefixed with
# it: veo-audit_pgdata, veo-audit_scheduler_state, veo-audit_valhalla_files.
# Renaming or moving that directory would therefore make compose derive a
# new project, create empty volumes, and bring up a blank Postgres — the
# real database still on disk but orphaned, looking for all the world like
# total data loss.
#
# Pinning it here makes the directory name cosmetic. Do NOT change this
# value: it is the key the live volumes are stored under. A repo rename
# does not require changing it, and must not.
name: veo-audit

services:
  denver_spatial_db:
    image: postgres:15
    container_name: denver_spatial_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    command:
      - postgres
      - -c
      - shared_buffers=2GB
      - -c
      - work_mem=64MB
      - -c
      - max_connections=20
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 2560M
    mem_limit: 2560m
    ports:
      - "127.0.0.1:5432:5432"

  pipeline_worker:
    image: ${WORKER_IMAGE:-ghcr.io/z280/scooter-fyi-api:latest}
    build:
      context: .
    container_name: pipeline_worker
    restart: unless-stopped
    depends_on:
      denver_spatial_db:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: denver_spatial_db
      POSTGRES_PORT: 5432
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME}
      R2_RECEIPTS_BUCKET: ${R2_RECEIPTS_BUCKET}
      # Routing assets published by denver-map-prep. Separate bucket AND
      # separate token: the archive credentials above are scoped to veo-audit's
      # own buckets and 401 on this one.
      R2_MAP_BUCKET: ${R2_MAP_BUCKET}
      R2_MAP_ACCESS_KEY_ID: ${R2_MAP_ACCESS_KEY_ID}
      R2_MAP_SECRET_ACCESS_KEY: ${R2_MAP_SECRET_ACCESS_KEY}
      SENTRY_DSN: ${SENTRY_DSN}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
      AUTH_ALLOWED_GITHUB_ORGS: ${AUTH_ALLOWED_GITHUB_ORGS}
      SESSION_SECRET: ${SESSION_SECRET}
      # Accounts & sessions (API_REQUIREMENTS.md §2) — without these,
      # api_auth.py/api_profile.py 503 even with a correct .env, because
      # they never reached the container.
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID}
      ADMIN_EMAILS: ${ADMIN_EMAILS}
      POSTMARK_TOKEN: ${POSTMARK_TOKEN}
      POSTMARK_FROM: ${POSTMARK_FROM}
      MAGIC_LINK_URL_TEMPLATE: ${MAGIC_LINK_URL_TEMPLATE}
      # z280-comms — SMS sign-in codes. Blank token = the SMS door 503s and
      # /auth/config reports sms_enabled:false, which is a supported state.
      # Reached by CONTAINER NAME over the comms-net network (below), not
      # over the tailnet. comms publishes only 127.0.0.1:8090 on the host,
      # so there is no bridge gateway to reach and the tailnet URL is not
      # routable from here — both were measured to time out from this
      # container. Note there is NO /comms path suffix: that prefix is a
      # `tailscale serve` mount point, not an application route.
      COMMS_TOKEN: ${COMMS_TOKEN}
      COMMS_BASE_URL: ${COMMS_BASE_URL}
      # Required: HMAC key for vehicle_identifier. Lose this and every
      # previously-emitted identifier becomes orphaned. Treat like a DB
      # encryption key — back up out of repo.
      VEHICLE_IDENTIFIER_SALT: ${VEHICLE_IDENTIFIER_SALT}
      VEO_CONFIG: /app/config.json
    volumes:
      # config.json is mounted so prod can swap it without rebuilding the image.
      - ./config.json:/app/config.json:ro
      # Shared with the scheduler container so /admin/scheduler/edit can
      # write to the live crontab and supercronic reloads within ~15s.
      - scheduler_state:/app/state
      # Read-only view of the Valhalla volume: api_route reads the canopy
      # coverage sidecar from here to score the `shade` profile. Read-only so
      # only the fetch sidecar can ever mutate the routing assets.
      - valhalla_files:/custom_files:ro
      # data/ is intentionally NOT mounted — the boundary files are baked into
      # the image (see Dockerfile). Mounting the host's (empty) ./data dir
      # here would mask the baked-in files and break boundary loading.
    deploy:
      resources:
        limits:
          memory: 1024M
    mem_limit: 1024m
    # No host port mapping in production: traffic enters via cloudflared.
    # For local dev, copy docker-compose.override.yml.example -> docker-compose.override.yml.
    expose:
      - "8080"

  # Cron scheduler: runs run-scheduler.sh, which supervises supercronic
  # against an admin-editable crontab on a shared volume. Same image as
  # pipeline_worker so the src.cli module + boundary data are available.
  # The schedule keeps firing even when uvicorn crashes; the worker can
  # restart freely without resetting cron timing.
    networks:
      - default
      # Reach z280-comms as http://comms:8090
      - comms-api
      # PUBLIC INGRESS -- data.scooter.fyi resolves `pipeline_worker:8080` over
      # this network. It MUST be declared here. A deploy recreates the
      # container, and a recreate drops any network attached at runtime rather
      # than in this file. Omitting this line took the site down on 2026-07-29.
      - ovh3-ingress

  scheduler:
    image: ${WORKER_IMAGE:-ghcr.io/z280/scooter-fyi-api:latest}
    build:
      context: .
    container_name: scheduler
    restart: unless-stopped
    depends_on:
      denver_spatial_db:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: denver_spatial_db
      POSTGRES_PORT: 5432
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME}
      R2_MAP_BUCKET: ${R2_MAP_BUCKET}
      R2_MAP_ACCESS_KEY_ID: ${R2_MAP_ACCESS_KEY_ID}
      R2_MAP_SECRET_ACCESS_KEY: ${R2_MAP_SECRET_ACCESS_KEY}
      SENTRY_DSN: ${SENTRY_DSN}
      # The scheduler owns `poll_comms_replies`, which is the ONLY thing
      # that ever sees a rider's STOP (replies are polled, never pushed).
      # Without these it silently no-ops — see src/comms_replies.py.
      COMMS_TOKEN: ${COMMS_TOKEN}
      COMMS_BASE_URL: ${COMMS_BASE_URL}
      # Required: matches pipeline_worker — the scheduler runs ingest_cycle
      # which calls hash_plate(), so it MUST have the same salt or every
      # cycle aborts with a salt-missing RuntimeError.
      VEHICLE_IDENTIFIER_SALT: ${VEHICLE_IDENTIFIER_SALT}
      VEO_CONFIG: /app/config.json
      # supercronic + libc honor TZ; cron entries run in this timezone so the
      # 9 AM Denver daily_sla job is DST-aware.
      TZ: America/Denver
    volumes:
      - ./config.json:/app/config.json:ro
      # Shared with pipeline_worker so /admin/scheduler/edit can write the
      # editable crontab. run-scheduler.sh polls its mtime and re-execs
      # supercronic on change.
      - scheduler_state:/app/state
      # Writable here (unlike pipeline_worker): refresh_routing_graph re-syncs
      # the .pbf and canopy sidecar from R2 on a schedule.
      - valhalla_files:/custom_files
      # Also writable here, and for the same reason: the 05:00
      # refresh_photon_index cron runs in THIS container and unpacks a new
      # geocoding index into the volume. pipeline_worker needs no mount at all —
      # it reaches Photon over HTTP.
      - photon_files:/photon
    command: ["/usr/local/bin/run-scheduler.sh"]
    # 1 GiB covers the peak job: the 02:00 archive's transient DuckDB
    # process streaming a normal 48h raw_telemetry_points window to
    # Parquet. 256M OOM'd on a 38M-row backlog (f34e4e2); the backlog is
    # drained, so the temporary 6144M ceiling is no longer needed.
    deploy:
      resources:
        limits:
          memory: 1024M
    mem_limit: 1024m

  # One-shot: pull denver_scooter_custom.pbf + the canopy sidecar out of the
  # private R2 bucket with SigV4. Valhalla's own `tile_urls` fetcher does an
  # unsigned HTTP GET and cannot read a private bucket, and we would rather not
  # make a 26 MB routing graph world-readable just to feed it.
    networks:
      - default
      # Reach z280-comms as http://comms:8090
      - comms-api

  valhalla_map_fetch:
    image: ${WORKER_IMAGE:-ghcr.io/z280/scooter-fyi-api:latest}
    build:
      context: .
    container_name: valhalla_map_fetch
    restart: "no"
    environment:
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_MAP_BUCKET: ${R2_MAP_BUCKET}
      R2_MAP_ACCESS_KEY_ID: ${R2_MAP_ACCESS_KEY_ID}
      R2_MAP_SECRET_ACCESS_KEY: ${R2_MAP_SECRET_ACCESS_KEY}
      VEO_CONFIG: /app/config.json
    volumes:
      - ./config.json:/app/config.json:ro
      - valhalla_files:/custom_files
    command: ["python", "-m", "src.cli", "fetch_map_pbf"]
    deploy:
      resources:
        limits:
          memory: 256M
    mem_limit: 256m

  # Routing engine. Builds tiles from whatever .pbf the fetch sidecar left in
  # /custom_files — `tile_urls` is deliberately unset so nothing is downloaded
  # over plain HTTP. Internal only: riders reach it through /api/v1/route.
  valhalla:
    image: ghcr.io/valhalla/valhalla-scripted:latest
    container_name: valhalla
    restart: unless-stopped
    depends_on:
      valhalla_map_fetch:
        condition: service_completed_successfully
    environment:
      # Build from the local .pbf rather than reusing a stale tile tarball.
      #
      # NOTE: this flag alone does NOT get you a fresh graph -- see
      # force_rebuild below. On its own it is necessary but not sufficient.
      use_tiles_ignore_pbf: "False"
      # SRTM for the Denver bbox is a single 1-degree cell; this is what makes
      # elevation_gain (and therefore the battery model's b2 term) possible.
      build_elevation: "True"
      build_admins: "True"
      build_time_zones: "False"
      build_tar: "True"
      # "True", and it has to be, because the upstream change-detection is
      # broken: valhalla-scripted's `hash_exists()` hashes the FILE PATH, not
      # the file contents --
      #
      #     hash=$(printf '%s' "${1}" | sha256sum | cut -f1 -d' ')
      #
      # where $1 is "/custom_files/denver_scooter_custom.pbf". Our pbf filename
      # is constant, so the hash is constant, `new_hashes` is permanently False
      # and `do_build` never fires while valhalla_tiles.tar exists. Verified on
      # the live volume: the stored hash in file_hashes.txt is exactly
      # sha256 of that path string.
      #
      # The practical effect was a graph frozen at its FIRST build while
      # denver-map-prep republished the pbf nightly -- 10 days stale before
      # anyone noticed, with no error anywhere. Recreating the container, which
      # is what the docs and src/cli.py used to tell operators to do, is a
      # no-op against this bug.
      #
      # Cost of "True" is a full rebuild on every container start. Measured on
      # the Denver extract with elevation already downloaded: ~14s. That is a
      # fair price for "the tiles always match the pbf on disk", and it is what
      # makes a restart a real remedy instead of a placebo.
      force_rebuild: "True"
      serve_tiles: "True"
      server_threads: "4"
    volumes:
      - valhalla_files:/custom_files
    expose:
      - "8002"
    # Serving a Denver-sized graph needs ~1 GiB; the headroom is for the
    # transient tile build, which is the actual peak.
    deploy:
      resources:
        limits:
          memory: 3072M
    mem_limit: 3072m

  # One-shot: pull the newest photon/photon-index-<YYYYMMDD>.tar.zst out of the
  # private R2 bucket with SigV4 and unpack it into the photon_files volume.
  # Photon has no fetcher of its own — the index is a directory it opens at JVM
  # startup — and the object is multi-GB in a private bucket, so this is the
  # same reasoning as valhalla_map_fetch above. ETag-gated, so it is a cheap
  # no-op on every `up`, and it exits 0 even when R2 is unreachable: `photon`
  # gates on service_completed_successfully and the deploy runs under `set -e`,
  # so a fetch failure must degrade address autocomplete, not abort the deploy.
  photon_index_fetch:
    image: ${WORKER_IMAGE:-ghcr.io/z280/scooter-fyi-api:latest}
    build:
      context: .
    container_name: photon_index_fetch
    restart: "no"
    environment:
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_MAP_BUCKET: ${R2_MAP_BUCKET}
      R2_MAP_ACCESS_KEY_ID: ${R2_MAP_ACCESS_KEY_ID}
      R2_MAP_SECRET_ACCESS_KEY: ${R2_MAP_SECRET_ACCESS_KEY}
      VEO_CONFIG: /app/config.json
    volumes:
      - ./config.json:/app/config.json:ro
      - photon_files:/photon
    command: ["python", "-m", "src.cli", "fetch_photon_index"]
    deploy:
      resources:
        limits:
          memory: 256M
    mem_limit: 256m

  # Geocoder behind /api/v1/geocode/search. Serves the index the fetch sidecar
  # left in /photon/photon_data and downloads nothing itself. Internal only:
  # riders reach it through the API proxy, which is where the per-IP rate limit
  # and the Denver bbox filter live (src/api_geocode.py).
  #
  # Built on the host from ./docker/photon. `docker compose up -d` builds it the
  # first time, but will NOT rebuild after a PHOTON_VERSION bump — that needs an
  # explicit `docker compose build photon` (and a matching rebuilt index).
  photon:
    build: ./docker/photon
    container_name: photon
    restart: unless-stopped
    depends_on:
      photon_index_fetch:
        condition: service_completed_successfully
    environment:
      # Photon embeds OpenSearch in THIS JVM, so the heap is the index budget.
      # 1536m under a 2048m limit leaves room for the JVM's non-heap footprint;
      # the Colorado-scoped index (scripts/build_photon_index.md) is what makes
      # that fit at all — a US-wide index does not.
      JAVA_OPTS: "-Xmx1536m"
      PHOTON_DATA_DIR: /photon
    volumes:
      # Writable: embedded OpenSearch takes a node lock and writes state inside
      # photon_data/.
      - photon_files:/photon
    expose:
      - "2322"
    # curl is installed in docker/photon/Dockerfile precisely for this — the
    # temurin JRE base ships neither curl nor wget, so without it this check
    # could only ever fail. start_period covers the JVM opening the index.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:2322/status || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 120s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 2048M
    mem_limit: 2048m


networks:
  # This project's own backend network -- denver_spatial_db, valhalla,
  # scheduler. Renamed from the implicit `veo-audit_default`, which had been
  # doubling as the host's PUBLIC INGRESS network for 24 hostnames across six
  # domains. It is now only what its name says.
  #
  # `external: true` (deploy fix): the rename commit's own message says "all
  # five networks already exist... this deploy is a no-op at the connectivity
  # level" -- i.e. `scooter-internal` was renamed on the VPS AHEAD of this
  # file landing, precisely so the rollout would be a no-op. But without
  # `external: true`, Compose does not treat a same-named pre-existing
  # network as "adopt it" -- it tries to CREATE and own a network called
  # `scooter-internal`, collides with the one already there (which carries no
  # compose-managed label, since it wasn't created by this compose project),
  # and refuses with "network scooter-internal was found but has incorrect
  # label com.docker.compose.network... exited with status 1". That has
  # failed `docker compose up -d` on every deploy since this rename merged
  # (confirmed via the last several `Build and deploy` Action runs), so
  # nothing has actually rolled out to production since -- silently, because
  # the earlier build-push job step still goes green. Fixed the same way the
  # other two externally-owned networks below already are.
  default:
    external: true
    name: scooter-internal

  # z280-comms, the messaging service. Membership IS the access control:
  # comms publishes only 127.0.0.1:8090 on the host, so nothing is exposed on
  # the bridge gateway, the public interface or the tailnet. A service not on
  # this network gets a DNS failure rather than a connection.
  #
  # Created and owned by z280/comms. If it does not exist, compose fails
  # loudly at `up`, which is the desired guard.
  comms-api:
    external: true
    name: comms-api

  # The ovh3 public ingress network, owned by z280/cloudflare-management
  # (ingress/). Was `veo-audit_default` -- this project's own default network,
  # which meant `docker compose down` here took 24 hostnames offline with it.
  ovh3-ingress:
    external: true
    name: ovh3-ingress

volumes:
  pgdata:
  scheduler_state:
  # Routing assets + built Valhalla tiles. A named volume, deliberately not a
  # bind mount: ./data is unmounted on purpose elsewhere in this file and the
  # same reasoning applies — nothing here should be shadowed by host state.
  valhalla_files:
  # Photon's geocoding index (photon_data/), seeded from R2 by
  # photon_index_fetch and served by `photon`. A named volume for the same
  # reason as valhalla_files: multi-GB state that must not be shadowed by host
  # state, and Photon writes lock/translog files inside it.
  photon_files:
