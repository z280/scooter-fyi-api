services:
  denver_spatial_db:
    image: postgres:15
    container_name: denver_spatial_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    command:
      - postgres
      - -c
      - shared_buffers=2GB
      - -c
      - work_mem=64MB
      - -c
      - max_connections=20
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 2560M
    mem_limit: 2560m
    ports:
      - "127.0.0.1:5432:5432"

  pipeline_worker:
    image: ${WORKER_IMAGE:-ghcr.io/z280/veo-audit:latest}
    build:
      context: .
    container_name: pipeline_worker
    restart: unless-stopped
    depends_on:
      denver_spatial_db:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: denver_spatial_db
      POSTGRES_PORT: 5432
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME}
      R2_RECEIPTS_BUCKET: ${R2_RECEIPTS_BUCKET}
      SENTRY_DSN: ${SENTRY_DSN}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
      AUTH_ALLOWED_GITHUB_ORGS: ${AUTH_ALLOWED_GITHUB_ORGS}
      MAP_OIDC_CLIENT_ID: ${MAP_OIDC_CLIENT_ID}
      MAP_OIDC_CLIENT_SECRET: ${MAP_OIDC_CLIENT_SECRET}
      MAP_AUTH_ALLOWED_GITHUB_ORGS: ${MAP_AUTH_ALLOWED_GITHUB_ORGS}
      SESSION_SECRET: ${SESSION_SECRET}
      # Accounts & sessions (API_REQUIREMENTS.md §2-§4) — without these,
      # api_auth.py/api_profile.py/stripe_webhook.py 503 even with a
      # correct .env, because they never reached the container.
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID}
      ADMIN_EMAILS: ${ADMIN_EMAILS}
      POSTMARK_TOKEN: ${POSTMARK_TOKEN}
      POSTMARK_FROM: ${POSTMARK_FROM}
      MAGIC_LINK_URL_TEMPLATE: ${MAGIC_LINK_URL_TEMPLATE}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      # Required: HMAC key for vehicle_identifier. Lose this and every
      # previously-emitted identifier becomes orphaned. Treat like a DB
      # encryption key — back up out of repo.
      VEHICLE_IDENTIFIER_SALT: ${VEHICLE_IDENTIFIER_SALT}
      VEO_CONFIG: /app/config.json
    volumes:
      # config.json is mounted so prod can swap it without rebuilding the image.
      - ./config.json:/app/config.json:ro
      # Shared with the scheduler container so /admin/scheduler/edit can
      # write to the live crontab and supercronic reloads within ~15s.
      - scheduler_state:/app/state
      # data/ is intentionally NOT mounted — the boundary files are baked into
      # the image (see Dockerfile). Mounting the host's (empty) ./data dir
      # here would mask the baked-in files and break boundary loading.
    deploy:
      resources:
        limits:
          memory: 1024M
    mem_limit: 1024m
    # No host port mapping in production: traffic enters via cloudflared.
    # For local dev, copy docker-compose.override.yml.example -> docker-compose.override.yml.
    expose:
      - "8080"

  # Cron scheduler: runs run-scheduler.sh, which supervises supercronic
  # against an admin-editable crontab on a shared volume. Same image as
  # pipeline_worker so the src.cli module + boundary data are available.
  # The schedule keeps firing even when uvicorn crashes; the worker can
  # restart freely without resetting cron timing.
  scheduler:
    image: ${WORKER_IMAGE:-ghcr.io/z280/veo-audit:latest}
    build:
      context: .
    container_name: scheduler
    restart: unless-stopped
    depends_on:
      denver_spatial_db:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: denver_spatial_db
      POSTGRES_PORT: 5432
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME}
      SENTRY_DSN: ${SENTRY_DSN}
      # Required: matches pipeline_worker — the scheduler runs ingest_cycle
      # which calls hash_plate(), so it MUST have the same salt or every
      # cycle aborts with a salt-missing RuntimeError.
      VEHICLE_IDENTIFIER_SALT: ${VEHICLE_IDENTIFIER_SALT}
      VEO_CONFIG: /app/config.json
      # supercronic + libc honor TZ; cron entries run in this timezone so the
      # 9 AM Denver daily_sla job is DST-aware.
      TZ: America/Denver
    volumes:
      - ./config.json:/app/config.json:ro
      # Shared with pipeline_worker so /admin/scheduler/edit can write the
      # editable crontab. run-scheduler.sh polls its mtime and re-execs
      # supercronic on change.
      - scheduler_state:/app/state
    command: ["/usr/local/bin/run-scheduler.sh"]
    deploy:
      resources:
        limits:
          memory: 6144M
    mem_limit: 6144m

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    depends_on:
      pipeline_worker:
        condition: service_started
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    deploy:
      resources:
        limits:
          memory: 128M
    mem_limit: 128m

volumes:
  pgdata:
  scheduler_state:
