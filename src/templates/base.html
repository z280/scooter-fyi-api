<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>{% block title %}veo-audit admin{% endblock %}</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
           margin: 0; padding: 0; background: #f7f7f7; color: #222; }
    nav  { background: #1a1a1a; color: #eee; padding: 12px 24px; }
    nav a { color: #9cf; text-decoration: none; margin-right: 18px; }
    nav .right { float: right; opacity: 0.85; font-size: 13px; }
    main { padding: 24px; max-width: 1200px; margin: 0 auto; }
    h1 { margin-top: 0; }
    table { border-collapse: collapse; width: 100%; background: white; }
    th, td { padding: 6px 10px; border-bottom: 1px solid #e2e2e2; text-align: left;
             font-size: 13px; vertical-align: top; }
    th { background: #ececec; }
    tr:hover td { background: #f3f7ff; }
    pre { background: #1a1a1a; color: #eee; padding: 12px; overflow-x: auto;
          border-radius: 4px; font-size: 12px; }
    .status-complete { color: #2a7; }
    .status-stale_aborted { color: #b80; }
    .status-upstream_failure { color: #c40; }
    .status-internal_failure { color: #c00; }
    .status-in_progress { color: #888; }
    code { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; }
  </style>
</head>
<body>
<nav>
  <a href="/admin/cycles">Cycles</a>
  <a href="/admin/scheduler">Scheduler</a>
  <a href="/admin/failures">Failures</a>
  <a href="/admin/regions?layer=neighborhood">Regions: NB</a>
  <a href="/admin/regions?layer=council_district">CD</a>
  <a href="/admin/regions?layer=community_network">CN</a>
  <a href="/admin/regions?layer=v1">v1</a>
  <a href="/admin/regions?layer=v2">v2</a>
  <a href="/admin/map-tokens">Map tokens</a>
  <span class="right">
    {% if user %}<code>{{ user.login }}</code> · <a href="/admin/logout">logout</a>{% endif %}
  </span>
</nav>
<main>
  {% block content %}{% endblock %}
</main>
</body>
</html>
