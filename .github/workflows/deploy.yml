name: Build and deploy

on:
  push:
    branches: [main]
  # Also on PRs, so `test` below gates a merge rather than reporting after the
  # fact. build-push/deploy stay main-only via their own `if:` conditions —
  # a PR gets the tests, not a deploy.
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    # Postgres so the *_pg suites actually run. Without VEO_TEST_PG_DSN they
    # self-skip -- 182 of them -- and skipping is indistinguishable from
    # passing in a summary line. Several real migration faults have only ever
    # been caught with this set.
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      VEO_CONFIG: ${{ github.workspace }}/config.json
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: test
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
      VEHICLE_IDENTIFIER_SALT: ci-fixed-salt
      VEO_TEST_PG_DSN: postgresql://test:test@127.0.0.1:5432/test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"          # matches the Dockerfile base
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      # Applies every sql/ file in order against a clean database. This is the
      # only place migrations are exercised end-to-end: the deploy has no
      # migration step, and production only ever applies them forward.
      - name: Apply migrations
        run: python -m src.cli migrate
      - name: Test
        run: python -m pytest tests/ -q

  build-push:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    # The script below does `docker login ghcr.io` with GITHUB_TOKEN and pulls
    # the private image onto the VPS. Don't inherit whatever the repo/org
    # default happens to be — ask for packages:read explicitly.
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      # The box's public :22 is closed — SSH/scp reach it only over the tailnet.
      # Join the ephemeral runner to Tailscale before the scp/ssh steps below.
      # Requires a Tailscale OAuth client (scope auth_keys) + an ACL letting
      # tag:ci reach the box on :22; store its id/secret as TSC_OAUTH_* secrets.
      # Also point the VPS_HOST secret at ovh3's tailnet address (MagicDNS name
      # e.g. ovh3.<tailnet>.ts.net, or its 100.x.y.z IP).
      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TSC_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TSC_OAUTH_SECRET }}
          tags: tag:ci

      - name: Sync compose + config to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # `docker/` is REQUIRED, not optional: the `photon` service is built
          # on the box (`build: ./docker/photon`) rather than pulled from GHCR,
          # so without this directory `docker compose up -d` cannot resolve its
          # build context and aborts the whole roll — not just geocoding.
          source: "docker-compose.yml,config.json,sql,docker"
          target: "/opt/veo-audit/"

      - name: Render .env and roll containers
        uses: appleboy/ssh-action@v1.0.3
        env:
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          OIDC_CLIENT_ID: ${{ secrets.OIDC_CLIENT_ID }}
          OIDC_CLIENT_SECRET: ${{ secrets.OIDC_CLIENT_SECRET }}
          AUTH_ALLOWED_GITHUB_ORGS: ${{ secrets.AUTH_ALLOWED_GITHUB_ORGS }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          VEHICLE_IDENTIFIER_SALT: ${{ secrets.VEHICLE_IDENTIFIER_SALT }}
          CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
          R2_RECEIPTS_BUCKET: ${{ secrets.R2_RECEIPTS_BUCKET }}
          R2_MAP_BUCKET: ${{ secrets.R2_MAP_BUCKET }}
          R2_MAP_ACCESS_KEY_ID: ${{ secrets.R2_MAP_ACCESS_KEY_ID }}
          R2_MAP_SECRET_ACCESS_KEY: ${{ secrets.R2_MAP_SECRET_ACCESS_KEY }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
          POSTMARK_TOKEN: ${{ secrets.POSTMARK_TOKEN }}
          POSTMARK_FROM: ${{ secrets.POSTMARK_FROM }}
          MAGIC_LINK_URL_TEMPLATE: ${{ secrets.MAGIC_LINK_URL_TEMPLATE }}
          COMMS_TOKEN: ${{ secrets.COMMS_TOKEN }}
          COMMS_BASE_URL: ${{ secrets.COMMS_BASE_URL }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
          REPO: ${{ github.repository }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # appleboy/ssh-action forwards ONLY the variables named here.
          # The step's `env:` block above populates them on the RUNNER; this
          # allowlist is what carries them to the REMOTE script. A secret
          # added to `env:` but not to this line expands to an empty string
          # in the heredoc below, silently, and the deploy still goes green.
          envs: POSTGRES_USER,POSTGRES_PASSWORD,POSTGRES_DB,R2_ACCOUNT_ID,R2_ACCESS_KEY_ID,R2_SECRET_ACCESS_KEY,R2_BUCKET_NAME,SENTRY_DSN,OIDC_CLIENT_ID,OIDC_CLIENT_SECRET,AUTH_ALLOWED_GITHUB_ORGS,SESSION_SECRET,VEHICLE_IDENTIFIER_SALT,CLOUDFLARE_TUNNEL_TOKEN,R2_RECEIPTS_BUCKET,R2_MAP_BUCKET,R2_MAP_ACCESS_KEY_ID,R2_MAP_SECRET_ACCESS_KEY,GOOGLE_OAUTH_CLIENT_ID,ADMIN_EMAILS,POSTMARK_TOKEN,POSTMARK_FROM,MAGIC_LINK_URL_TEMPLATE,COMMS_TOKEN,COMMS_BASE_URL,GH_TOKEN,GH_ACTOR,REPO
          script: |
            set -e
            cd /opt/veo-audit
            umask 077
            # Render into .env.new and only promote it once the image it names
            # has actually been pulled. Overwriting .env first makes a failed
            # pull destructive: `set -e` aborts with .env pointing at an image
            # the box cannot fetch, and the next `docker compose up -d` can no
            # longer create the containers at all. Rendering aside keeps a
            # failed deploy a red CI run instead of an outage.
            trap 'rm -f /opt/veo-audit/.env.new' EXIT
            cat > .env.new <<EOF
            POSTGRES_USER=$POSTGRES_USER
            POSTGRES_PASSWORD=$POSTGRES_PASSWORD
            POSTGRES_DB=$POSTGRES_DB
            R2_ACCOUNT_ID=$R2_ACCOUNT_ID
            R2_ACCESS_KEY_ID=$R2_ACCESS_KEY_ID
            R2_SECRET_ACCESS_KEY=$R2_SECRET_ACCESS_KEY
            R2_BUCKET_NAME=$R2_BUCKET_NAME
            R2_RECEIPTS_BUCKET=$R2_RECEIPTS_BUCKET
            R2_MAP_BUCKET=$R2_MAP_BUCKET
            R2_MAP_ACCESS_KEY_ID=$R2_MAP_ACCESS_KEY_ID
            R2_MAP_SECRET_ACCESS_KEY=$R2_MAP_SECRET_ACCESS_KEY
            SENTRY_DSN=$SENTRY_DSN
            OIDC_CLIENT_ID=$OIDC_CLIENT_ID
            OIDC_CLIENT_SECRET=$OIDC_CLIENT_SECRET
            AUTH_ALLOWED_GITHUB_ORGS=$AUTH_ALLOWED_GITHUB_ORGS
            SESSION_SECRET=$SESSION_SECRET
            SESSION_HTTPS_ONLY=true
            VEHICLE_IDENTIFIER_SALT=$VEHICLE_IDENTIFIER_SALT
            CLOUDFLARE_TUNNEL_TOKEN=$CLOUDFLARE_TUNNEL_TOKEN
            GOOGLE_OAUTH_CLIENT_ID=$GOOGLE_OAUTH_CLIENT_ID
            ADMIN_EMAILS=$ADMIN_EMAILS
            POSTMARK_TOKEN=$POSTMARK_TOKEN
            POSTMARK_FROM=$POSTMARK_FROM
            MAGIC_LINK_URL_TEMPLATE=$MAGIC_LINK_URL_TEMPLATE
            # z280-comms. Both are read by docker-compose.yml; a blank
            # COMMS_TOKEN leaves the SMS door closed and /auth/config
            # reporting sms_enabled:false, which is a supported state.
            # COMMS_BASE_URL is http://comms:8090 — container name on the
            # comms-net network, and NO /comms path suffix (that prefix is a
            # tailscale serve mount point, not an app route).
            COMMS_TOKEN=$COMMS_TOKEN
            COMMS_BASE_URL=$COMMS_BASE_URL
            WORKER_IMAGE=ghcr.io/$REPO:latest
            EOF
            echo "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin
            docker compose --env-file .env.new pull
            mv .env.new .env
            # `photon` is the one service built HERE instead of pulled: the
            # geocoding sidecar wraps a pinned upstream jar (docker/photon/),
            # so `pull` above skips it. `up -d` alone would build it only when
            # the image is missing, which means a PHOTON_VERSION or Dockerfile
            # change would silently never land. Build it explicitly; it is a
            # layer-cache no-op on every deploy that didn't touch it.
            docker compose build photon
            docker compose up -d --remove-orphans
            sleep 8
            # Fire one ingest cycle synchronously so /health has data to report,
            # instead of waiting up to 10 min for supercronic's next tick.
            docker compose exec -T scheduler python -m src.cli ingest_cycle || true
            # Worker port is internal-only (no host mapping); smoke-test from inside.
            docker compose exec -T pipeline_worker curl -fsS http://localhost:8080/health
